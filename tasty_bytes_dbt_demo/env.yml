env_config:
  default_environment: dev
  environments:
    - name: dev
      env:
        DBT_SNOWFLAKE_ACCOUNT: "{{ select CURRENT_ACCOUNT() }}"
        DBT_SNOWFLAKE_USER: "{{ select CURRENT_USER() }}"
        DBT_SNOWFLAKE_ROLE: "{{ select CURRENT_ROLE() }}"
        DBT_SNOWFLAKE_DATABASE: TASTY_BYTES_DBT_DEV_DB
        DBT_SNOWFLAKE_SCHEMA: "{{ select CURRENT_USER() }}"
        DBT_SNOWFLAKE_WAREHOUSE: COMPUTE_WH
    - name: prod
      env:
        DBT_SNOWFLAKE_ACCOUNT: "{{ select CURRENT_ACCOUNT() }}"
        DBT_SNOWFLAKE_USER: "{{ select CURRENT_USER() }}"
        DBT_SNOWFLAKE_ROLE: "{{ select CURRENT_ROLE() }}"
        DBT_SNOWFLAKE_DATABASE: TASTY_BYTES_DBT_PROD_DB
        DBT_SNOWFLAKE_SCHEMA: PROD
        DBT_SNOWFLAKE_WAREHOUSE: COMPUTE_WH
